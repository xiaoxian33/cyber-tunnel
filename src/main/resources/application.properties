spring.application.name=cyber-tunnel

# ===== 数据库连接配置 =====
# 支持用环境变量覆盖（部署时推荐），未设置时使用后面的默认值方便本地开发
# Windows(PowerShell):  $env:DB_USERNAME="root"; $env:DB_PASSWORD="你的密码"
# Linux/macOS:          export DB_USERNAME=root DB_PASSWORD=你的密码
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cyber_tunnel_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ===== JPA 配置 =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

